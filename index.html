function urlBase64ToUint8Array(base64) {
  const padding = "=".repeat((4 - (base64.length % 4)) % 4);
  const b64 = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function storageGet(key) {
  try {
    const v = localStorage.getItem("ce-soir:" + key);
    return v !== null ? { value: v } : null;
  } catch { return null; }
}
async function storageSet(key, value) {
  try { localStorage.setItem("ce-soir:" + key, value); } catch {}
  return { key, value };
}

async function safeJson(res) {
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// Tous les appels TMDB passent par le Worker Cloudflare, qui détient la clé TMDB en secret
// serveur (jamais exposée au navigateur) — voir /tmdb/* dans index.js.
function tmdbUrl(path, params = {}) {
  const p = new URLSearchParams({ language: "fr-FR", ...params });
  return `${WORKER_URL}/tmdb${path}?${p.toString()}`;
}
// Cache mémoire (durée de la session) devant le Worker : évite de refaire un aller-retour réseau
// pour un appel identique déjà fait il y a peu (ex : rouvrir la même fiche détail, revenir en
// arrière, re-basculer Films/Séries). Le Worker a déjà son propre cache d'edge plus long ; celui-ci
// n'est qu'une couche supplémentaire côté navigateur, sans risque de fraîcheur vu les durées courtes.
const tmdbMemCache = new Map(); // clé: URL complète -> { data, expires }
function tmdbCacheTtlMs(path) {
  if (/^\/genre\//.test(path)) return 1000 * 60 * 60;
  if (/^\/watch\/providers\//.test(path)) return 1000 * 60 * 60;
  if (/^\/search\/keyword/.test(path)) return 1000 * 60 * 60;
  if (/^\/search\/person/.test(path)) return 1000 * 60 * 30;
  if (/^\/(movie|tv)\/\d+$/.test(path)) return 1000 * 60 * 15;
  if (/^\/discover\//.test(path)) return 1000 * 60 * 2;
  if (/^\/search\/(movie|tv|multi)/.test(path)) return 1000 * 60 * 10;
  return 1000 * 30;
}
async function tmdbFetch(path, params) {
  const url = tmdbUrl(path, params);
  const cached = tmdbMemCache.get(url);
  if (cached && cached.expires > Date.now()) return cached.data;
  const data = await fetch(url).then(safeJson);
  tmdbMemCache.set(url, { data, expires: Date.now() + tmdbCacheTtlMs(path) });
  return data;
}

// État partagé "foyer" (déjà vu + sélection commune), stocké côté Worker (Cloudflare KV).
async function sharedFetch(path, { method = "GET", body } = {}) {
  return fetch(`${WORKER_URL}/shared${path}`, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  }).then(safeJson);
}
function yearOf(item) { const d = item.release_date || item.first_air_date; return d ? d.slice(0, 4) : "—"; }
function momentOfDay() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return "Ce matin";
  if (h >= 12 && h < 14) return "Ce midi";
  if (h >= 14 && h < 18) return "Cet après-midi";
  if (h >= 18 && h < 23) return "Ce soir";
  return "Cette nuit";
}
function titleOf(item) { return item.title || item.name || "Sans titre"; }
function genreIdsOf(item) {
  if (Array.isArray(item.genre_ids)) return item.genre_ids;
  if (Array.isArray(item.genres)) return item.genres.map((g) => g.id);
  return [];
}

  useEffect(() => {
    const isStandalone = window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true;
    if (isStandalone) return;
    (async () => {
      const dismissed = await storageGet("pwa-install-dismissed");

      const ua = window.navigator.userAgent || "";
      if (/iphone|ipad|ipod/i.test(ua) && !window.MSStream) {

      function onPrompt(e) { e.preventDefault(); setPwaEvent(e); setShowInstallBanner(true); }

      window.addEventListener("beforeinstallprompt", onPrompt);
      window.addEventListener("appinstalled", onInstalled);

  // fois dans les Réglages et mémorisé en local — pas un vrai compte, juste une étiquette.
  useEffect(() => {
    (async () => {
      const who = await storageGet("who-am-i");
      if (who?.value) setWhoAmI(who.value);
      if (typeof Notification === "undefined" || !("serviceWorker" in navigator) || !("PushManager" in window)) {
        setPushStatus("unsupported");
        return;
      }
      if (Notification.permission === "denied") { setPushStatus("denied"); return; }
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        setPushStatus(sub ? "on" : "idle");
      } catch { setPushStatus("idle"); }
    })();
  }, []);

  useEffect(() => {

    sharedFetch("/ping", { method: "POST", body: { email: whoAmI } }).catch(() => {});
  }, [whoAmI]);

  async function chooseWhoAmI(email) {
    setWhoAmI(email);
    await storageSet("who-am-i", email);
  }

  async function enablePush() {
    if (!whoAmI) { showToast("Choisis d'abord qui tu es ci-dessus"); return; }
    setPushBusy(true);
    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") { setPushStatus(permission === "denied" ? "denied" : "idle"); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      }
      await sharedFetch("/push-subscribe", { method: "POST", body: { email: whoAmI, subscription: sub.toJSON() } });
      setPushStatus("on");
      showToast("Notifications activées 🔔");
    } catch {
      showToast("Impossible d'activer les notifications");
    } finally {
      setPushBusy(false);
    }
  }

  async function disablePush() {
    setPushBusy(true);
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
      if (whoAmI) await sharedFetch("/push-unsubscribe", { method: "POST", body: { email: whoAmI } });
      setPushStatus("idle");
    } catch {} finally {
      setPushBusy(false);
    }
  }

  // Cache localStorage 24h pour les données quasi-statiques (genres, plateformes) : évite l'appel
  // réseau au démarrage la plupart du temps, donc affichage immédiat des chips/filtres sans
  // attendre le Worker/TMDB. Rafraîchi automatiquement une fois par jour.
  const DAY_MS = 1000 * 60 * 60 * 24;
  async function readCachedJson(key) {
    const raw = await storageGet(key);
    if (!raw?.value) return null;
    try {
      const parsed = JSON.parse(raw.value);
      return parsed.expires > Date.now() ? parsed.data : null;
    } catch { return null; }
  }
  async function writeCachedJson(key, data, ttlMs = DAY_MS) {
    await storageSet(key, JSON.stringify({ data, expires: Date.now() + ttlMs }));
  }

  const loadGenres = useCallback(async () => {
    try {
      const cached = await readCachedJson("genre-map-cache");
      if (cached) { setGenreMap(cached); setGenresLoaded(true); return; }
      const [gm, gt] = await Promise.all([
        tmdbFetch("/genre/movie/list"),
        tmdbFetch("/genre/tv/list"),
      ]);
      const map = {};
      gm.genres?.forEach((g) => { map[g.name.toLowerCase()] = { ...(map[g.name.toLowerCase()] || {}), movie: g.id }; });
      gt.genres?.forEach((g) => { map[g.name.toLowerCase()] = { ...(map[g.name.toLowerCase()] || {}), tv: g.id }; });
      setGenreMap(map);
      setGenresLoaded(true);
      writeCachedJson("genre-map-cache", map);
    } catch { setGenresLoaded(false); }
  }, []);

  useEffect(() => { loadGenres(); }, [loadGenres]);

  // Liste des plateformes de streaming (France) pour le badge "disponible sur" et le filtre.
  // TMDB Watch Providers (données JustWatch) — mêmes fournisseurs pour films et séries pour
  // simplifier le sélecteur, fusionnés et triés par popularité (display_priority).
  useEffect(() => {
    if (!genresLoaded || providers.length) return;
    (async () => {
      try {
        const cached = await readCachedJson("providers-cache");
        if (cached) { setProviders(cached); return; }
        const [pm, pt] = await Promise.all([
          tmdbFetch("/watch/providers/movie", { watch_region: "FR" }),
          tmdbFetch("/watch/providers/tv", { watch_region: "FR" }),
        ]);
        const byId = new Map();
        [...(pm.results || []), ...(pt.results || [])].forEach((p) => {
          if (!byId.has(p.provider_id)) byId.set(p.provider_id, p);
        });
        const list = [...byId.values()].sort((a, b) => (a.display_priority ?? 999) - (b.display_priority ?? 999)).slice(0, 20);
        setProviders(list);
        writeCachedJson("providers-cache", list);
      } catch {}
    })();
  }, [genresLoaded, providers.length]);

  // Parse un export CSV Netflix ("Title,Date"). Netflix log chaque épisode séparément au
  // format "Série: S1: Nom de l'épisode" — on sépare le nom de série (pour le regroupement
  // et la recherche TMDB) du détail d'épisode (gardé pour l'affichage détaillé).
  function parseNetflixCsv(text) {
    const lines = text.split(/\r?\n/).filter(Boolean);
    const header = lines[0]?.toLowerCase().split(",") || [];
    let titleIdx = header.findIndex((h) => h.includes("title"));
    if (titleIdx === -1) titleIdx = 0;
    let dateIdx = header.findIndex((h) => h.includes("date"));

    const rows = lines.slice(1).map((line) => {
      const cells = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
      const rawTitle = (cells[titleIdx] || "").replace(/^"|"$/g, "").trim();
      const date = dateIdx !== -1 ? (cells[dateIdx] || "").replace(/^"|"$/g, "").trim() : "";
      const parts = rawTitle.split(":");
      const series = parts[0].trim();
      const episode = parts.length > 1 ? parts.slice(1).join(":").trim() : "";
      return { series, episode, date };
    }).filter((r) => r.series);

    const uniqueTitles = [...new Set(rows.map((r) => r.series))];
    return { rows, uniqueTitles };
  }

  // Regroupe l'historique par série/film : compte les épisodes et retient la date la plus
  // récente (le CSV Netflix liste toujours du plus récent au plus ancien).
  function groupHistory(rows) {
    const map = new Map();
    for (const r of rows) {
      if (!map.has(r.series)) map.set(r.series, { title: r.series, count: 0, lastDate: r.date, episodes: [] });
      const g = map.get(r.series);
      g.count++;
      if (r.episode) g.episodes.push({ episode: r.episode, date: r.date });
    }
    return [...map.values()];
  }

  function parseNetflixDate(d) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{2})$/.exec((d || "").trim());
    if (!m) return null;
    const year = 2000 + Number(m[3]);
    return { year, month: Number(m[1]), day: Number(m[2]) };
  }

  // Le CSV Netflix est au format US M/D/YY (ex: "8/5/26" = 5 août 2026) — reformaté en JJ/MM/AA pour l'affichage.
  function formatDateFR(d) {
    const parsed = parseNetflixDate(d);
    if (!parsed) return d || "—";
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(parsed.day)}/${pad(parsed.month)}/${pad(parsed.year % 100)}`;
  }

  // Analyse un échantillon de titres via TMDB pour en déduire un profil de goûts (genres dominants).
  async function buildTasteProfile(uniqueTitles) {
    const sample = uniqueTitles.slice(0, 40);
    const genreCount = {};
    let matched = 0;
    for (const t of sample) {
      try {
        const r = await tmdbFetch("/search/multi", { query: t });
        const hit = r.results?.find((x) => x.media_type === "movie" || x.media_type === "tv");
        if (hit) { matched++; (hit.genre_ids || []).forEach((g) => (genreCount[g] = (genreCount[g] || 0) + 1)); }
      } catch {}
    }
    const topIds = Object.entries(genreCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id]) => Number(id));
    const names = Object.entries(genreMap).filter(([, ids]) => topIds.includes(ids.movie) || topIds.includes(ids.tv)).map(([name]) => name);
    return { genreIds: topIds, names, sampleCount: matched, total: uniqueTitles.length };
  }

  async function processCsvText(text, { silent = false } = {}) {
    const { rows, uniqueTitles } = parseNetflixCsv(text);
    if (!rows.length) return;
    setWatchHistory(rows);
    await storageSet("watch-history-v2", JSON.stringify(rows));

    if (!silent) { setCsvLoading(true); setCsvStatus(`Analyse de ${Math.min(40, uniqueTitles.length)} titres sur ${uniqueTitles.length}…`); }
    const profile = await buildTasteProfile(uniqueTitles);
    setTasteProfile(profile);
    await storageSet("taste-profile", JSON.stringify(profile));
    if (!silent) {
      setCsvLoading(false);
      setCsvStatus(`${profile.sampleCount} titres reconnus sur ${Math.min(40, uniqueTitles.length)} · goûts dominants : ${profile.names.slice(0, 4).join(", ") || "non déterminés"}`);
    }
  }

  function handleCsvFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const text = String(ev.target.result || "");
      await processCsvText(text, { silent: false });
      showToast("Historique importé — remplace l'historique précédent");
    };
    reader.readAsText(file);
  }

  // Chargement automatique de l'historique hébergé sur le site, une seule fois, si aucun
  // historique local n'existe déjà (import manuel prioritaire).
  useEffect(() => {
    if (!genresLoaded || autoLoadedRef.current) return;
    autoLoadedRef.current = true;
    if (watchHistory.length > 0) return; // déjà un historique (importé ou déjà auto-chargé)
    (async () => {
      try {
        const res = await fetch(DEFAULT_CSV_URL);
        if (!res.ok) return;
        const text = await res.text();
        await processCsvText(text, { silent: true });
      } catch {}
    })();
  }, [genresLoaded]);

  // Genres "préférés" pour les suggestions par défaut et Surprends-moi : profil de goûts calculé
  // depuis l'historique Netflix, enrichi des genres des titres marqués "J'aime" par le foyer (signal
  // plus frais et explicite, placé en tête). Doit être déclaré avant les effets qui l'utilisent
  // dans leur tableau de dépendances (évalué immédiatement au rendu, contrairement au corps de l'effet).
  const preferredGenreIds = useMemo(() => {
    const likedGenreCounts = {};
    likedItems.forEach((f) => (f.genreIds || []).forEach((id) => { likedGenreCounts[id] = (likedGenreCounts[id] || 0) + 1; }));
    const likedGenreIds = Object.entries(likedGenreCounts).sort((a, b) => b[1] - a[1]).map(([id]) => Number(id));
    const merged = [...likedGenreIds, ...(tasteProfile?.genreIds || [])];
    return [...new Set(merged)].slice(0, 6);
  }, [likedItems, tasteProfile]);

  // Suggestions par défaut à l'arrivée sur l'écran (une seule fois), pour ne pas laisser
  // l'écran vide : pioche pondérée par le profil de goûts si dispo, sinon popularité générale.
  useEffect(() => {
    if (!booted || !genresLoaded || autoSuggestedRef.current) return;
    if (resultsLoading || results.length) return;
    autoSuggestedRef.current = true;
    runDiscover({ genreIds: preferredGenreIds.length ? preferredGenreIds : [] });
  }, [booted, genresLoaded, preferredGenreIds, results.length, resultsLoading]);

  // Historique groupé par série/film (un titre Netflix = plusieurs épisodes = plusieurs lignes CSV).
  const groupedHistory = useMemo(() => groupHistory(watchHistory), [watchHistory]);

  const historyYears = useMemo(() => {
    const ys = new Set();
    watchHistory.forEach((r) => { const d = parseNetflixDate(r.date); if (d) ys.add(d.year); });
    return [...ys].sort((a, b) => b - a);
  }, [watchHistory]);

  // Correspondance id de genre TMDB -> nom affichable (fr), déduite de genreMap {nom: {movie,tv}}.
  const genreIdToName = useMemo(() => {
    const map = {};
    Object.entries(genreMap).forEach(([name, ids]) => {
      if (ids.movie) map[ids.movie] = name;
      if (ids.tv) map[ids.tv] = name;
    });
    return map;
  }, [genreMap]);

  // Catégories disponibles dans l'historique déjà enrichi (posters chargés = genres connus).
  const historyGenreOptions = useMemo(() => {
    const names = new Set();
    Object.values(historyPosters).forEach((p) => (p.genreIds || []).forEach((id) => { if (genreIdToName[id]) names.add(genreIdToName[id]); }));
    return [...names].sort();
  }, [historyPosters, genreIdToName]);

  // Filtre texte/année seulement — sert de base au chargement différé des affiches, pour que
  // l'enrichissement progresse même quand un filtre film/série ou catégorie est actif.
  const textYearFilteredHistory = useMemo(() => {
    const q = historyFilter.trim().toLowerCase();
    return groupedHistory.filter((g) => {
      if (q && !g.title.toLowerCase().includes(q)) return false;
      if (historyYear !== "all") {
        const d = parseNetflixDate(g.lastDate);
        if (!d || String(d.year) !== historyYear) return false;
      }
      return true;
    });
  }, [groupedHistory, historyFilter, historyYear]);

  // Filtre final affiché : ajoute film/série + catégorie, qui nécessitent que le titre soit
  // déjà enrichi (affiche chargée) — les titres pas encore analysés sont masqués le temps
  // qu'ils soient récupérés en arrière-plan.
  const filteredHistory = useMemo(() => {
    if (historyTypeFilter === "all" && historyGenreFilter === "all") return textYearFilteredHistory;
    return textYearFilteredHistory.filter((g) => {
      const p = historyPosters[g.title];
      if (!p) return false;
      if (historyTypeFilter !== "all" && p.mediaType !== historyTypeFilter) return false;
      if (historyGenreFilter !== "all" && !(p.genreIds || []).some((id) => genreIdToName[id] === historyGenreFilter)) return false;
      return true;
    });
  }, [textYearFilteredHistory, historyTypeFilter, historyGenreFilter, historyPosters, genreIdToName]);

  // Enrichissement TMDB différé : uniquement pour les titres actuellement visibles dans le
  // drawer Historique, et jamais deux fois pour le même titre (cache localStorage persistant).
  useEffect(() => {
    if (!historyOpen) return;
    const toFetch = textYearFilteredHistory.filter((g) => !historyPosters[g.title] && !fetchingPostersRef.current.has(g.title)).slice(0, 60);
    if (!toFetch.length) return;
    let cancelled = false;
    (async () => {
      const updates = {};
      for (const g of toFetch) {
        if (cancelled) break;
        fetchingPostersRef.current.add(g.title);
        try {
          const r = await tmdbFetch("/search/multi", { query: g.title });
          const hit = r.results?.find((x) => x.media_type === "movie" || x.media_type === "tv");
          updates[g.title] = hit ? { poster: hit.poster_path || null, mediaType: hit.media_type, id: hit.id, genreIds: hit.genre_ids || [] } : { poster: null };
        } catch { updates[g.title] = { poster: null }; }
      }
      if (cancelled || !Object.keys(updates).length) return;
      setHistoryPosters((prev) => {
        const next = { ...prev, ...updates };
        storageSet("history-posters", JSON.stringify(next));
        return next;
      });
    })();
    return () => { cancelled = true; };
  }, [historyOpen, textYearFilteredHistory, historyPosters]);

  const runDiscover = useCallback(async ({ type = mediaType, genreIds = activeGenreIds, minVote = minRating, sort = sortBy, castIds = [], keywordIds = (lgbtActive && lgbtKeywordId ? [lgbtKeywordId] : []), providerId = activeProviderId, originCountry = activeCountry, yearFrom = activeYear || undefined, yearTo = activeYear || undefined, page = 1, append = false } = {}) => {
    setResultsSource("discover");
    if (append) setResultsLoadingMore(true); else { setResultsLoading(true); setResultsError(""); }
    // Mémorisé pour que "charger plus" (scroll infini) puisse rejouer exactement les mêmes
    // critères sur la page suivante, sans avoir à tout re-décrire à l'appel.
    lastDiscoverParamsRef.current = { type, genreIds, minVote, sort, castIds, keywordIds, providerId, originCountry, yearFrom, yearTo };
    try {
      const params = { sort_by: sort, "vote_count.gte": "30", page: String(page) };
      // "|" = OU logique côté TMDB (un des genres suffit) — "," ferait un ET (tous les genres à
      // la fois), ce qui ne renvoie quasiment jamais de résultat dès qu'on combine plusieurs genres.
      if (genreIds.length) params.with_genres = genreIds.join("|");
      if (minVote) params["vote_average.gte"] = String(minVote);
      if (castIds.length) params.with_cast = castIds.join(",");
      if (keywordIds.length) params.with_keywords = keywordIds.join(",");
      if (providerId) { params.with_watch_providers = String(providerId); params.watch_region = "FR"; }
      if (originCountry) params.with_origin_country = originCountry;
      const dateField = type === "movie" ? "primary_release_date" : "first_air_date";
      if (yearFrom) params[`${dateField}.gte`] = `${yearFrom}-01-01`;
      if (yearTo) params[`${dateField}.lte`] = `${yearTo}-12-31`;

      const data = await tmdbFetch(`/discover/${type === "movie" ? "movie" : "tv"}`, params);
      const dislikedKeys = new Set(dislikedItems.map((f) => f.key));
      const items = (data.results || []).map((it) => ({ ...it, media_type: type }))
        .filter((it) => !seenIds.has(`${type}-${it.id}`) && !dislikedKeys.has(`${type}-${it.id}`));

      setResultsPage(page);
      setResultsHasMore(page < (data.total_pages || 1));
      setResults((prev) => {
        if (!append) return items;
        const already = new Set(prev.map((p) => `${p.media_type}-${p.id}`));
        return [...prev, ...items.filter((it) => !already.has(`${it.media_type}-${it.id}`))];
      });
      if (!append) setCurrentIndex(0);
      if (!append && !items.length) setResultsError("Aucun résultat pour ces critères — élargis un peu les filtres.");
    } catch { if (!append) setResultsError("Impossible de charger les suggestions (Worker/TMDB hors ligne ?)."); }
    if (append) setResultsLoadingMore(false); else setResultsLoading(false);
  }, [mediaType, activeGenreIds, minRating, sortBy, seenIds, dislikedItems, lgbtActive, lgbtKeywordId, activeProviderId, activeYear, activeCountry]);

  // Recherche "classique" : recherche TMDB par titre (/search), sans interprétation IA — pour
  // retrouver un titre précis quand on sait déjà ce qu'on cherche plutôt que décrire une envie.
  async function runClassicSearch({ page = 1, append = false } = {}) {
    const query = moodInput.trim();
    if (!query) return;
    setResultsSource("classic");
    if (append) setResultsLoadingMore(true); else { setResultsLoading(true); setResultsError(""); setMoodError(""); }
    try {
      const kind = mediaType === "movie" ? "movie" : "tv";
      const searchParams = { query, page: String(page) };
      if (activeYear) searchParams[kind === "movie" ? "primary_release_year" : "first_air_date_year"] = String(activeYear);
      const data = await tmdbFetch(`/search/${kind}`, searchParams);
      const dislikedKeys = new Set(dislikedItems.map((f) => f.key));
      let items = (data.results || []).map((it) => ({ ...it, media_type: mediaType }))
        .filter((it) => !seenIds.has(`${mediaType}-${it.id}`) && !dislikedKeys.has(`${mediaType}-${it.id}`));
      if (activeCountry) items = items.filter((it) => (it.origin_country || []).includes(activeCountry));

      setResultsPage(page);
      setResultsHasMore(page < (data.total_pages || 1));
      setResults((prev) => {
        if (!append) return items;
        const already = new Set(prev.map((p) => `${p.media_type}-${p.id}`));
        return [...prev, ...items.filter((it) => !already.has(`${it.media_type}-${it.id}`))];
      });
      if (!append) setCurrentIndex(0);
      if (!append && !items.length) setResultsError(`Aucun résultat pour "${query}".`);
    } catch { if (!append) setResultsError("Impossible de lancer la recherche (Worker/TMDB hors ligne ?)."); }
    if (append) setResultsLoadingMore(false); else setResultsLoading(false);
  }

  function runSearch() { if (searchMode === "ai") runMoodSearch(); else runClassicSearch(); }

  function loadMoreResults() {
    if (resultsLoading || resultsLoadingMore || !resultsHasMore) return;
    if (resultsSource === "classic") runClassicSearch({ page: resultsPage + 1, append: true });
    else runDiscover({ ...lastDiscoverParamsRef.current, page: resultsPage + 1, append: true });
  }

  // Scroll infini : observe une sentinelle en bas des vues grille/liste et charge la page
  // suivante quand elle devient visible.
  useEffect(() => {
    if (resultsView !== "grid" && resultsView !== "list") return;
    const el = loadMoreSentinelRef.current;
    if (!el || !resultsHasMore) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadMoreResults();
    }, { rootMargin: "400px" });
    observer.observe(el);
    return () => observer.disconnect();
  }, [resultsView, resultsHasMore, resultsLoadingMore, resultsPage, results.length, resultsSource]);

  // Résout une seule fois l'id du mot-clé TMDB "lgbt" pour le filtre thématique de la home.
  useEffect(() => {
    if (lgbtKeywordId) return;
    (async () => {
      try {
        const r = await tmdbFetch("/search/keyword", { query: "lgbt" });
        const hit = r.results?.find((k) => k.name.toLowerCase() === "lgbt") || r.results?.[0];
        if (hit) setLgbtKeywordId(hit.id);
      } catch {}
    })();
  }, [lgbtKeywordId]);

  function toggleLgbt() {
    const next = !lgbtActive;
    setLgbtActive(next);
    runDiscover({ keywordIds: next && lgbtKeywordId ? [lgbtKeywordId] : [] });
  }

  async function openDetail(item) {
    const mt = item.media_type || item.mediaType;
    const id = item.id;
    if (!mt || !id) return;
    setDetailItem({ id, media_type: mt });
    setDetailData(null);
    setDetailLoading(true);
    try {
      const kind = mt === "movie" ? "movie" : "tv";
      const data = await tmdbFetch(`/${kind}/${id}`, { append_to_response: "credits,videos,watch/providers" });
      setDetailData(data);
    } catch { setDetailData({ error: true }); }
    setDetailLoading(false);
  }

  async function runMoodSearch() {
    const prompt = moodInput.trim();
    if (!prompt) return;
    setMoodLoading(true);
    setMoodError("");
    try {
      const likedTitles = likedItems.slice(0, 12).map((f) => {
        const genreNames = (f.genreIds || []).map((id) => genreIdToName[id]).filter(Boolean);
        return genreNames.length ? `${f.title} (${genreNames.join("/")})` : f.title;
      });

      const system = `Tu transformes une envie exprimée en langage naturel (en français) en critères de recherche TMDB.
Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, au format exact :
{"type":"movie"|"tv","genres":[string],"year_from":number|null,"year_to":number|null,"cast_names":[string],"min_rating":number|null,"sort":"popularity.desc"|"vote_average.desc"|"primary_release_date.desc"}
Les genres doivent venir uniquement de cette liste : ${MOVIE_GENRE_NAMES_FR.join(", ")}.
"récent" veut dire année de début = ${new Date().getFullYear() - 3}. "type" vaut "tv" si l'utilisateur mentionne une série, sinon "movie".${likedTitles.length ? `
Le foyer aime ces titres (avec leurs genres) : ${likedTitles.join(", ")}. Si l'envie exprimée est vague ou ne précise pas de genre, laisse-toi influencer par ces goûts connus pour choisir les genres les plus pertinents parmi la liste autorisée.` : ""}`;

      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system, messages: [{ role: "user", content: prompt }] }),
      });
      const data = await res.json();
      const text = (data.content || []).map((b) => b.text || "").join("").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);

      const genreIds = (parsed.genres || []).map((n) => genreMap[n.toLowerCase()]?.[parsed.type === "tv" ? "tv" : "movie"]).filter(Boolean);

      let castIds = [];
      if (parsed.cast_names?.length) {
        const found = await Promise.all(parsed.cast_names.slice(0, 3).map((name) =>
          tmdbFetch("/search/person", { query: name }).then((r) => r.results?.[0]?.id).catch(() => null)
        ));
        castIds = found.filter(Boolean);
      }

      const type = parsed.type === "tv" ? "tv" : "movie";
      setMediaType(type);
      setActiveGenreIds(genreIds);
      setMinRating(parsed.min_rating || 0);
      setSortBy(parsed.sort || "popularity.desc");

      await runDiscover({ type, genreIds, minVote: parsed.min_rating || 0, sort: parsed.sort || "popularity.desc", castIds, yearFrom: parsed.year_from, yearTo: parsed.year_to });
    } catch (e) { setMoodError("Je n'ai pas réussi à interpréter cette envie — vérifie l'URL du Worker ou reformule."); }
    setMoodLoading(false);
  }

  // "Surprends-moi" : au lieu d'un tirage TMDB pondéré localement, on demande à l'IA de choisir
  // des critères en tenant compte des goûts du foyer (j'aime / j'aime pas), des filtres déjà actifs
  // à l'écran (prioritaires s'il y en a), du moment de la journée, et en évitant de répéter les
  // 2-3 derniers tirages. Le "déjà vu" reste exclu des résultats affichés comme avant (runDiscover).
  async function surpriseMe() {
    setResultsLoading(true);
    setResultsError("");
    try {
      const describeItems = (items) => items.slice(0, 12).map((f) => {
        const names = (f.genreIds || []).map((id) => genreIdToName[id]).filter(Boolean);
        return names.length ? `${f.title} (${names.join("/")})` : f.title;
      });
      const likedTitles = describeItems(likedItems);
      const dislikedTitles = describeItems(dislikedItems);

      const activeGenreNames = activeGenreIds.map((id) => genreIdToName[id]).filter(Boolean);
      const activeProviderName = providers.find((p) => p.provider_id === activeProviderId)?.provider_name;
      const activeCountryName = COUNTRIES_FR.find(([code]) => code === activeCountry)?.[1];
      const hasActiveFilter = activeGenreNames.length > 0 || minRating > 0 || lgbtActive || !!activeProviderId || !!activeYear || !!activeCountry;
      const wantsDiscovery = Math.random() < 1 / 3;
      const recentGenres = [...new Set(lastSurpriseGenresRef.current.flat())];

      const system = `Tu choisis des critères de recherche TMDB pour surprendre l'utilisateur avec une proposition de ${mediaType === "tv" ? "série" : "film"} ce soir.
Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, au format exact :
{"genres":[string],"year_from":number|null,"year_to":number|null,"cast_names":[string],"min_rating":number|null,"sort":"popularity.desc"|"vote_average.desc"|"primary_release_date.desc"}
Les genres doivent venir uniquement de cette liste : ${MOVIE_GENRE_NAMES_FR.join(", ")}.

${hasActiveFilter
  ? `Des filtres sont déjà actifs à l'écran (prioritaires, respecte-les strictement, affine juste casting/tri) : ${activeGenreNames.length ? `genres = ${activeGenreNames.join(", ")}` : "aucun genre imposé"}${minRating ? `, note minimale = ${minRating}` : ""}${lgbtActive ? ", thème LGBT+" : ""}${activeProviderName ? `, disponible sur ${activeProviderName} uniquement` : ""}${activeYear ? `, année = ${activeYear}` : ""}${activeCountryName ? `, pays d'origine = ${activeCountryName}` : ""}.`
  : "Aucun filtre actif à l'écran : base-toi uniquement sur les goûts ci-dessous."}
${likedTitles.length ? `Le foyer aime : ${likedTitles.join(", ")}.` : "Aucun goût \"j'aime\" connu pour l'instant."}
${dislikedTitles.length ? `Le foyer n'aime PAS, à éviter absolument (genres et registre similaires) : ${dislikedTitles.join(", ")}.` : ""}
${seenIds.size ? `${seenIds.size} titres déjà vus seront de toute façon exclus des résultats automatiquement, inutile d'y penser.` : ""}
${recentGenres.length ? `Les derniers tirages "Surprends-moi" portaient déjà sur : ${recentGenres.join(", ")} — varie un peu si possible pour ne pas te répéter.` : ""}
${wantsDiscovery ? "Cette fois, ose sortir un peu du registre habituel : propose un genre adjacent mais différent de ce que le foyer aime déjà, pour la découverte." : ""}
Il est actuellement ${momentOfDay()} : adapte le ton si pertinent (plus léger/court en journée, plus libre en soirée/nuit) sans que ce soit un critère strict.`;

      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, system, messages: [{ role: "user", content: "Surprends-moi." }] }),
      });
      const data = await res.json();
      const text = (data.content || []).map((b) => b.text || "").join("").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);

      const genreNames = hasActiveFilter && activeGenreNames.length ? activeGenreNames : (parsed.genres || []);
      const genreIds = genreNames.map((n) => genreMap[n.toLowerCase()]?.[mediaType]).filter(Boolean);

      let castIds = [];
      if (parsed.cast_names?.length) {
        const found = await Promise.all(parsed.cast_names.slice(0, 3).map((name) =>
          tmdbFetch("/search/person", { query: name }).then((r) => r.results?.[0]?.id).catch(() => null)
        ));
        castIds = found.filter(Boolean);
      }

      lastSurpriseGenresRef.current = [...lastSurpriseGenresRef.current, genreNames].slice(-3);

      await runDiscover({
        type: mediaType,
        genreIds: genreIds.length ? genreIds : preferredGenreIds,
        minVote: hasActiveFilter && minRating ? minRating : (parsed.min_rating || 6.5),
        sort: parsed.sort || "popularity.desc",
        castIds,
        yearFrom: activeYear || parsed.year_from,
        yearTo: activeYear || parsed.year_to,
      });
    } catch (e) {
      setResultsError("Je n'ai pas réussi à te surprendre — vérifie l'URL du Worker ou réessaie.");
      setResultsLoading(false);
    }
  }

  async function persistSeenItems(next) { setSeenItems(next); await storageSet("seen-items-v2", JSON.stringify(next)); }
  async function persistFavorites(next) { setFavorites(next); await storageSet("favorites", JSON.stringify(next)); }

  function advanceCard() { setDragX(0); setCurrentIndex((i) => i + 1); setTrailerOpenFor(null); }

  function recordSeen(item) {
    const key = `${item.media_type}-${item.id}`;
    if (seenIds.has(key)) return key;
    const entry = { key, id: item.id, media_type: item.media_type, title: titleOf(item), poster: item.poster_path, year: yearOf(item), genreIds: genreIdsOf(item) };
    persistSeenItems([entry, ...seenItems].slice(0, 300));
    sharedFetch("/seen-add", { method: "POST", body: { item: entry } }).catch(() => {}); // déjà vu = partagé entre les 2
    return key;
  }

  function removeSeen(key) {
    persistSeenItems(seenItems.filter((f) => f.key !== key));
    sharedFetch("/seen-remove", { method: "POST", body: { key } }).catch(() => {});
  }

  function markSeen(item) { recordSeen(item); advanceCard(); }

  function markSeenElsewhere(item) { recordSeen(item); showToast("Marqué comme déjà vu"); }

  function addFavorite(item) {
    const key = `${item.media_type}-${item.id}`;
    if (favorites.some((f) => f.key === key)) { advanceCard(); return; }
    const next = [{ key, id: item.id, media_type: item.media_type, title: titleOf(item), poster: item.poster_path, year: yearOf(item) }, ...favorites].slice(0, 12);
    persistFavorites(next); showToast("Ajouté à ta sélection perso ♥"); advanceCard();
  }

  function removeFavorite(key) { persistFavorites(favorites.filter((f) => f.key !== key)); }

  function addSharedFavorite(item) {
    const key = `${item.media_type}-${item.id}`;
    if (sharedFavorites.some((f) => f.key === key)) { showToast("Déjà dans la sélection du foyer"); return; }
    const fav = { key, id: item.id, media_type: item.media_type, title: titleOf(item), poster: item.poster_path, year: yearOf(item) };
    setSharedFavorites((prev) => [fav, ...prev].slice(0, 24));
    sharedFetch("/favorite-add", { method: "POST", body: { item: fav, by: whoAmI } }).catch(() => {});
    showToast("Ajouté à la sélection du foyer 🏠");
  }

  function removeSharedFavorite(key) {
    setSharedFavorites((prev) => prev.filter((f) => f.key !== key));
    sharedFetch("/favorite-remove", { method: "POST", body: { key } }).catch(() => {});
  }

  // "J'aime" / "J'aime pas" : partagés foyer uniquement (une seule liste commune, pas de version
  // perso). "J'aime" ne s'exclut pas des suggestions (on a pu juste regarder la bande-annonce et
  // se le garder pour plus tard) ; "J'aime pas" s'exclut, comme "déjà vu".
  function addLike(item) {
    const key = `${item.media_type}-${item.id}`;
    setDislikedItems((prev) => prev.filter((f) => f.key !== key)); // un j'aime annule un j'aime-pas précédent
    sharedFetch("/dislike-remove", { method: "POST", body: { key } }).catch(() => {});
    if (likedItems.some((f) => f.key === key)) { showToast("Déjà dans les goûts du foyer"); return; }
    const fav = { key, id: item.id, media_type: item.media_type, title: titleOf(item), poster: item.poster_path, year: yearOf(item), genreIds: genreIdsOf(item) };
    setLikedItems((prev) => [fav, ...prev].slice(0, 60));
    sharedFetch("/like-add", { method: "POST", body: { item: fav } }).catch(() => {});
    showToast("Ajouté aux goûts du foyer 👍");
  }

  function removeLike(key) {
    setLikedItems((prev) => prev.filter((f) => f.key !== key));
    sharedFetch("/like-remove", { method: "POST", body: { key } }).catch(() => {});
  }

  function addDislike(item) {
    const key = `${item.media_type}-${item.id}`;
    setLikedItems((prev) => prev.filter((f) => f.key !== key)); // un j'aime-pas annule un j'aime précédent
    sharedFetch("/like-remove", { method: "POST", body: { key } }).catch(() => {});
    if (dislikedItems.some((f) => f.key === key)) { showToast("Déjà exclu des suggestions"); return; }
    const fav = { key, id: item.id, media_type: item.media_type, title: titleOf(item), poster: item.poster_path, year: yearOf(item), genreIds: genreIdsOf(item) };
    setDislikedItems((prev) => [fav, ...prev].slice(0, 60));
    sharedFetch("/dislike-add", { method: "POST", body: { item: fav } }).catch(() => {});
    showToast("Ne sera plus suggéré 👎");
  }

  function removeDislike(key) {
    setDislikedItems((prev) => prev.filter((f) => f.key !== key));
    sharedFetch("/dislike-remove", { method: "POST", body: { key } }).catch(() => {});
  }

  async function openTrailer(item) {
    if (trailerOpenFor === item.id) { setTrailerOpenFor(null); return; }
    setTrailerOpenFor(item.id); setTrailerLoading(true); setTrailerUrl("");
    try {
      const kind = item.media_type === "movie" ? "movie" : "tv";
      let data = await tmdbFetch(`/${kind}/${item.id}/videos`);
      let vid = data.results?.find((v) => v.site === "YouTube" && v.type === "Trailer");
      if (!vid) {
        data = await tmdbFetch(`/${kind}/${item.id}/videos`, { language: "en-US" });
        vid = data.results?.find((v) => v.site === "YouTube" && v.type === "Trailer") || data.results?.[0];
      }
      if (vid) setTrailerUrl(`https://www.youtube.com/embed/${vid.key}?autoplay=1`);
    } catch {}
    setTrailerLoading(false);
  }

  function onPointerDown(e) { dragState.current = { dragging: true, startX: e.clientX, dx: 0 }; setDragging(true); }
  function onPointerMove(e) { if (!dragState.current.dragging) return; const dx = e.clientX - dragState.current.startX; dragState.current.dx = dx; setDragX(dx); }
  function onPointerUp() {
    if (!dragState.current.dragging) return;
    const dx = dragState.current.dx; dragState.current.dragging = false; setDragging(false);
    const current = results[currentIndex];
    if (Math.abs(dx) > 110 && current) { if (dx > 0) addFavorite(current); else markSeen(current); } else { setDragX(0); }
  }

  function toggleGenre(name) {
    const id = genreMap[name.toLowerCase()]?.[mediaType];
    if (!id) return;
    const next = activeGenreIds.includes(id) ? activeGenreIds.filter((g) => g !== id) : [...activeGenreIds, id];
    setActiveGenreIds(next);
    runDiscover({ genreIds: next });
  }

  async function resetSeenAndFavorites() {
    await persistSeenItems([]);
    await persistFavorites([]);
    setSharedFavorites([]);
    setLikedItems([]);
    setDislikedItems([]);
    sharedFetch("/reset", { method: "POST" }).catch(() => {}); // remet aussi à zéro le déjà-vu, la sélection et les goûts du foyer
    showToast("Historique de choix réinitialisé");
  }

  const current = results[currentIndex];
  const next2 = results.slice(currentIndex + 1, currentIndex + 3);

  if (!booted) {
    return <div style={{ background: C.bg, minHeight: "100vh" }} className="flex items-center justify-center"><Icon name="loader" color={C.amber} size={28} /></div>;
  }

  return (
    <div style={{ background: C.bg, color: C.ink, minHeight: "100vh" }} className="w-full flex flex-col relative overflow-hidden">
      <header className="relative px-5 pt-6 pb-4 flex items-center justify-between overflow-hidden" style={{ borderBottom: `1px solid ${C.border}` }}>
        <div className="sweep absolute inset-y-0 left-0 w-1/3 pointer-events-none" style={{ background: `linear-gradient(90deg, transparent, ${C.amber}22, transparent)`, animation: "sweep 2.4s ease-out 1" }} />
        <div>
          <p className="font-mono text-xs tracking-widest" style={{ color: C.amberDim }}>QU'EST-CE QU'ON REGARDE ?</p>
          <h1 className="font-display text-3xl">{momentOfDay()}</h1>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setHistoryOpen(true)} aria-label="Historique Netflix" className="rounded-full flex items-center justify-center" style={{ background: C.bgCard, width: 36, height: 36 }}>
            <span aria-hidden="true" style={{ color: "#E50914", fontWeight: 800, fontSize: 17, fontFamily: "'Inter', sans-serif", lineHeight: 1 }}>N</span>
          </button>
          <button onClick={() => setSettingsOpen(true)} aria-label="Réglages" className="p-2 rounded-full" style={{ background: C.bgCard }}>
            <Icon name="settings" color={C.inkMuted} />
          </button>
        </div>
      </header>

      {showInstallBanner && (
        <div className="mx-5 mt-4 rounded-xl px-4 py-3 flex items-center gap-3" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
          <div className="p-2 rounded-full shrink-0" style={{ background: `${C.amber}22` }}>
            <Icon name="download" color={C.amber} size={18} />
          </div>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-medium">Installer Quoi regarder</p>
            <p className="text-xs" style={{ color: C.inkMuted }}>
              {isIosDevice
                ? <>Appuie sur <span style={{ color: C.ink }}>Partager</span> puis <span style={{ color: C.ink }}>Sur l'écran d'accueil</span>.</>
                : "Accès rapide depuis ton écran d'accueil, comme une vraie appli."}
            </p>
          </div>
          {!isIosDevice && (
            <button onClick={installPwa} className="shrink-0 rounded-full px-3 py-1.5 text-xs font-semibold" style={{ background: C.amber, color: "#1A1305" }}>
              Installer
            </button>
          )}
          <button onClick={dismissInstallBanner} aria-label="Fermer" className="shrink-0 p-1.5 rounded-full" style={{ color: C.inkMuted }}>
            <Icon name="x" size={14} />
          </button>
        </div>
      )}

      <div className="px-5 pt-4">
        <div className="flex gap-0.5 rounded-full p-0.5 mb-2 w-fit" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
          <button onClick={() => setSearchMode("ai")} className="rounded-full px-2.5 py-1 text-[11px] font-medium flex items-center gap-1"
            style={{ background: searchMode === "ai" ? C.amber : "transparent", color: searchMode === "ai" ? "#1A1305" : C.inkMuted }}>
            <Icon name="sparkles" size={12} fill={searchMode === "ai" ? "#1A1305" : "none"} /> Recherche IA
          </button>
          <button onClick={() => setSearchMode("classic")} className="rounded-full px-2.5 py-1 text-[11px] font-medium flex items-center gap-1"
            style={{ background: searchMode === "classic" ? C.amber : "transparent", color: searchMode === "classic" ? "#1A1305" : C.inkMuted }}>
            <Icon name="search" size={12} color={searchMode === "classic" ? "#1A1305" : C.inkMuted} /> Classique
          </button>
        </div>
        <div className="flex gap-2">
          <input value={moodInput} onChange={(e) => setMoodInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && runSearch()}
            placeholder={searchMode === "ai" ? "Une comédie française récente avec…" : "Rechercher un titre précis…"} className="flex-1 rounded-xl px-4 py-3 text-sm"
            style={{ background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }} />
          <button onClick={runSearch} disabled={searchMode === "ai" ? moodLoading : resultsLoading} className="rounded-xl px-4 flex items-center justify-center" style={{ background: C.amber, color: "#1A1305" }} aria-label="Chercher">
            <Icon name={(searchMode === "ai" ? moodLoading : resultsLoading) ? "loader" : (searchMode === "ai" ? "sparkles" : "search")} size={18} color="#1A1305" fill={(searchMode === "ai" && !moodLoading) ? "#1A1305" : "none"} />
          </button>
        </div>
        {moodError && <p className="text-xs mt-2" style={{ color: C.danger }}>{moodError}</p>}
      </div>

      <div className="px-5 pt-3 pb-2 flex gap-2 overflow-x-auto scrollbar-none">
        <button onClick={() => { setMediaType("movie"); runDiscover({ type: "movie" }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5"
          style={{ background: mediaType === "movie" ? C.amber : C.bgCard, color: mediaType === "movie" ? "#1A1305" : C.ink, border: `1px solid ${C.border}` }}>
          <Icon name="film" size={13} /> Films
        </button>
        <button onClick={() => { setMediaType("tv"); runDiscover({ type: "tv" }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5"
          style={{ background: mediaType === "tv" ? C.amber : C.bgCard, color: mediaType === "tv" ? "#1A1305" : C.ink, border: `1px solid ${C.border}` }}>
          <Icon name="tv" size={13} /> Séries
        </button>
        {["Comédie", "Drame", "Thriller", "Action", "Science-Fiction", "Horreur", "Romance", "Animation"].map((g) => (
          <button key={g} onClick={() => toggleGenre(g)} className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium"
            style={{ background: activeGenreIds.includes(genreMap[g.toLowerCase()]?.[mediaType]) ? C.amber : C.bgCard, color: activeGenreIds.includes(genreMap[g.toLowerCase()]?.[mediaType]) ? "#1A1305" : C.ink, border: `1px solid ${C.border}` }}>
            {g}
          </button>
        ))}
        <button onClick={toggleLgbt} disabled={!lgbtKeywordId} className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium"
          style={{ background: lgbtActive ? C.amber : C.bgCard, color: lgbtActive ? "#1A1305" : C.ink, border: `1px solid ${C.border}`, opacity: lgbtKeywordId ? 1 : 0.5 }}>
          🏳️‍🌈 LGBT+

        <button onClick={() => { const v = minRating >= 7 ? 0 : 7; setMinRating(v); runDiscover({ minVote: v }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1" style={{ background: minRating >= 7 ? C.amber : C.bgCard, color: minRating >= 7 ? "#1A1305" : C.ink, border: `1px solid ${C.border}` }}>
          <Icon name="star" size={12} fill={minRating >= 7 ? "#1A1305" : "none"} /> 7+
        </button>
        <select value={sortBy} onChange={(e) => { setSortBy(e.target.value); runDiscover({ sort: e.target.value }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }}>
          <option value="popularity.desc">Tri : Popularité</option>
          <option value="vote_average.desc">Tri : Note</option>
          <option value="primary_release_date.desc">Tri : Année</option>
        </select>
        {providers.length > 0 && (
          <select value={activeProviderId ?? ""} onChange={(e) => { const v = e.target.value ? Number(e.target.value) : null; setActiveProviderId(v); runDiscover({ providerId: v }); }}
            className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: activeProviderId ? C.amber : C.bgCard, border: `1px solid ${C.border}`, color: activeProviderId ? "#1A1305" : C.ink }}>
            <option value="">Plateforme : Toutes</option>
            {providers.map((p) => <option key={p.provider_id} value={p.provider_id}>{p.provider_name}</option>)}
          </select>
        )}
        <select value={activeYear ?? ""} onChange={(e) => { const v = e.target.value ? Number(e.target.value) : null; setActiveYear(v); runDiscover({ yearFrom: v || undefined, yearTo: v || undefined }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: activeYear ? C.amber : C.bgCard, border: `1px solid ${C.border}`, color: activeYear ? "#1A1305" : C.ink }}>
          <option value="">Année : Toutes</option>
          {YEAR_OPTIONS.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
        <select value={activeCountry ?? ""} onChange={(e) => { const v = e.target.value || null; setActiveCountry(v); runDiscover({ originCountry: v }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: activeCountry ? C.amber : C.bgCard, border: `1px solid ${C.border}`, color: activeCountry ? "#1A1305" : C.ink }}>
          <option value="">Pays : Tous</option>
          {COUNTRIES_FR.map(([code, label]) => <option key={code} value={code}>{label}</option>)}
        </select>
        <div className="shrink-0 flex gap-0.5 rounded-full p-0.5" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
          {[["grid", "grid", "Galerie"], ["list", "list", "Liste"], ["swipe", "layers", "Swipe"]].map(([v, icon, label]) => (
            <button key={v} onClick={() => setResultsView(v)} aria-label={label} className="rounded-full p-1.5"
              style={{ background: resultsView === v ? C.amber : "transparent" }}>
              <Icon name={icon} size={13} color={resultsView === v ? "#1A1305" : C.inkMuted} />
            </button>
          ))}
        </div>
      </div>

      <main className={`flex-1 px-5 py-6 relative ${(resultsView === "grid" || resultsView === "list") && results.length ? "" : "flex flex-col items-center justify-center"}`} style={{ minHeight: 460 }}>
        {resultsLoading && <div className="flex justify-center"><Icon name="loader" color={C.amber} size={26} /></div>}
        {!resultsLoading && resultsError && <p className="text-sm text-center px-6" style={{ color: C.inkMuted }}>{resultsError}</p>}
        {!resultsLoading && !results.length && !resultsError && (
          <div className="text-center px-6">
            <p className="font-display text-xl mb-2">Prêt pour la séance ?</p>
            <p className="text-sm" style={{ color: C.inkMuted }}>Tape ton envie du moment ci-dessus, choisis un genre, ou laisse-toi surprendre.</p>
          </div>

                        return (
                          <button key={g.title} className="text-left" onClick={() => (poster?.id ? openDetail(poster) : null)}>
                            <div className="rounded-lg overflow-hidden relative" style={{ aspectRatio: "2/3", background: C.bg, border: `1px solid ${C.border}` }}>
                              <img src={poster?.poster ? `https://image.tmdb.org/t/p/w185${poster.poster}` : FALLBACK_POSTER} alt="" className="w-full h-full object-cover" />
                              {g.count > 1 && (
                                <div className="absolute top-1 right-1 rounded-full px-1.5 py-0.5 font-mono text-[10px]" style={{ background: "#10121Ad0", color: C.teal }}>×{g.count}</div>
                              )}
                            </div>
                            <p className="text-[11px] mt-1 truncate">{g.title}</p>
                            <p className="font-mono text-[10px]" style={{ color: C.inkMuted }}>{formatDateFR(g.lastDate)}</p>
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {historyView === "list" && filteredHistory.map((g) => {
                    const poster = historyPosters[g.title];
                    const isOpen = expandedSeries === g.title;
                    const key = poster?.id ? `${poster.mediaType}-${poster.id}` : null;
                    const isLiked = key && likedItems.some((f) => f.key === key);
                    const isDisliked = key && dislikedItems.some((f) => f.key === key);
                    const historyItem = poster?.id ? { id: poster.id, media_type: poster.mediaType, title: g.title, poster_path: poster.poster, genre_ids: poster.genreIds } : null;
                    return (
                      <div key={g.title} style={{ borderBottom: `1px solid ${C.border}` }}>
                        <div className="w-full flex items-center gap-3 py-2.5 text-left">
                          <button className="shrink-0" onClick={() => (poster?.id ? openDetail(poster) : null)}>
                            <img src={poster?.poster ? `https://image.tmdb.org/t/p/w92${poster.poster}` : FALLBACK_POSTER}
                              alt="" className="w-8 h-11 object-cover rounded" style={{ background: C.bg }} />
                          </button>
                          <button className="flex-1 min-w-0 flex items-center gap-3 text-left" onClick={() => g.count > 1 && setExpandedSeries(isOpen ? null : g.title)}>
                            <div className="flex-1 min-w-0">
                              <p className="text-sm truncate">{g.title}</p>
                              {g.count > 1 && <p className="text-xs" style={{ color: C.teal }}>{g.count} épisodes</p>}
                            </div>
                            <p className="font-mono text-xs shrink-0" style={{ color: C.ink }}>{formatDateFR(g.lastDate) || "—"}</p>
                            {g.count > 1 && <Icon name={isOpen ? "chevronUp" : "chevronDown"} size={14} color={C.inkMuted} />}
                          </button>
                          {historyItem && (
                            <div className="flex items-center gap-0.5 shrink-0">
                              <button onClick={() => addLike(historyItem)} aria-label="J'aime" className="p-1 rounded-full" style={{ background: isLiked ? "#1E3A22" : "transparent" }}>
                                <Icon name="thumbsUp" size={14} color="#5FAE6C" fill={isLiked ? "#5FAE6C" : "none"} />
                              </button>
                              <button onClick={() => addDislike(historyItem)} aria-label="J'aime pas" className="p-1 rounded-full" style={{ background: isDisliked ? "#3A1E1E" : "transparent" }}>
                                <Icon name="thumbsDown" size={14} color={C.danger} fill={isDisliked ? C.danger : "none"} />
                              </button>
                            </div>
                          )}
                        </div>
                        {isOpen && g.count > 1 && (
                          <div className="pl-11 pb-2 flex flex-col gap-1.5">
                            {g.episodes.map((e, i) => (
                              <div key={i} className="flex items-center justify-between gap-3">
                                <p className="text-xs truncate" style={{ color: C.inkMuted }}>{e.episode}</p>
                                <p className="font-mono text-[11px] shrink-0" style={{ color: C.inkMuted }}>{formatDateFR(e.date)}</p>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {filteredHistory.length > 60 && <p className="text-[11px] pt-2" style={{ color: C.inkMuted }}>Affiches chargées pour les 60 premiers titres visibles · affine le filtre pour en voir plus.</p>}
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {detailItem && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "#000000b0" }} onClick={() => setDetailItem(null)}>
          <div className="w-full rounded-t-2xl overflow-y-auto" style={{ background: C.bgCard, borderTop: `1px solid ${C.border}`, maxHeight: "92vh" }} onClick={(e) => e.stopPropagation()}>
            {detailLoading && <div className="flex items-center justify-center" style={{ height: 300 }}><Icon name="loader" color={C.amber} size={26} /></div>}
            {!detailLoading && detailData?.error && (
              <div className="p-6 text-center">
                <p className="text-sm mb-3" style={{ color: C.inkMuted }}>Impossible de charger la fiche.</p>
                <button onClick={() => setDetailItem(null)} className="text-xs" style={{ color: C.amber }}>Fermer</button>
              </div>
            )}
            {!detailLoading && detailData && !detailData.error && (() => {
              const d = detailData;
              const title = d.title || d.name;
              const year = (d.release_date || d.first_air_date || "").slice(0, 4);
              const trailer = d.videos?.results?.find((v) => v.site === "YouTube" && v.type === "Trailer") || d.videos?.results?.[0];
              const cast = (d.credits?.cast || []).slice(0, 5);
              const watchProviders = d["watch/providers"]?.results?.FR?.flatrate || [];
              return (
                <>
                  <div className="relative" style={{ aspectRatio: "16/9", background: "#000" }}>
                    <button onClick={() => setDetailItem(null)} className="absolute top-3 right-3 z-10 p-2 rounded-full" style={{ background: "#10121Ad0" }} aria-label="Fermer">
                      <Icon name="x" size={18} color={C.ink} />
                    </button>
                    {trailer ? (
                      <iframe src={`https://www.youtube.com/embed/${trailer.key}`} className="w-full h-full" allow="autoplay; encrypted-media" title="Bande-annonce" />
                    ) : (
                      <img src={d.backdrop_path ? `https://image.tmdb.org/t/p/w780${d.backdrop_path}` : (d.poster_path ? `https://image.tmdb.org/t/p/w500${d.poster_path}` : FALLBACK_POSTER)} alt="" className="w-full h-full object-cover" />
                    )}
                  </div>
                  <div className="p-5">
                    <p className="font-mono text-[11px] tracking-wide mb-1" style={{ color: C.teal }}>{year || "—"} · {detailItem.media_type === "movie" ? "FILM" : "SÉRIE"}{d.runtime ? ` · ${d.runtime} min` : ""}{d.number_of_seasons ? ` · ${d.number_of_seasons} saison${d.number_of_seasons > 1 ? "s" : ""}` : ""}</p>
                    <h2 className="font-display text-2xl leading-tight mb-2">{title}</h2>
                    <div className="flex items-center gap-1 mb-3">
                      <Icon name="star" size={14} color={C.amber} fill={C.amber} />
                      <span className="text-sm font-medium" style={{ color: C.amber }}>{d.vote_average?.toFixed(1) ?? "—"}</span>
                      <span className="text-xs ml-1" style={{ color: C.inkMuted }}>({d.vote_count ?? 0} votes)</span>
                    </div>
                    {(d.genres || []).length > 0 && (
                      <div className="flex flex-wrap gap-1.5 mb-3">
                        {d.genres.map((g) => (
                          <span key={g.id} className="rounded-full px-2.5 py-1 text-[11px]" style={{ background: C.bg, border: `1px solid ${C.border}`, color: C.ink }}>{g.name}</span>
                        ))}
                      </div>
                    )}
                    {watchProviders.length > 0 && (
                      <div className="mb-3">
                        <p className="text-xs font-mono mb-1.5" style={{ color: C.inkMuted }}>DISPONIBLE SUR</p>
                        <div className="flex flex-wrap gap-2">
                          {watchProviders.map((p) => (
                            <div key={p.provider_id} className="flex items-center gap-1.5 rounded-full pl-1 pr-2.5 py-1" style={{ background: C.bg, border: `1px solid ${C.border}` }}>
                              <img src={`https://image.tmdb.org/t/p/w45${p.logo_path}`} alt="" className="w-5 h-5 rounded-full object-cover" />
                              <span className="text-[11px]" style={{ color: C.ink }}>{p.provider_name}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    <p className="text-sm leading-snug mb-4" style={{ color: C.inkMuted }}>{d.overview || "Synopsis non disponible."}</p>
                    {cast.length > 0 && (
                      <div className="mb-4">
                        <p className="text-xs font-mono mb-1.5" style={{ color: C.inkMuted }}>CASTING</p>
                        <p className="text-sm" style={{ color: C.ink }}>{cast.map((c) => c.name).join(", ")}</p>
                      </div>
                    )}
                    <div className="flex gap-2 mb-2">
                      <button onClick={() => addLike({ id: d.id, media_type: detailItem.media_type, title, poster_path: d.poster_path, release_date: d.release_date, first_air_date: d.first_air_date, genres: d.genres })}
                        className="flex-1 rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2" style={{ background: "#1E3A22", border: `1px solid ${C.border}` }}>
                        <Icon name="thumbsUp" size={15} color="#5FAE6C" /> J'aime
                      </button>
                      <button onClick={() => addDislike({ id: d.id, media_type: detailItem.media_type, title, poster_path: d.poster_path, release_date: d.release_date, first_air_date: d.first_air_date, genres: d.genres })}
                        className="flex-1 rounded-full py-2.5 text-sm font-medium flex items-center justify-center gap-2" style={{ background: "#3A1E1E", border: `1px solid ${C.border}` }}>
                        <Icon name="thumbsDown" size={15} color={C.danger} /> J'aime pas
                      </button>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => markSeenElsewhere({ id: d.id, media_type: detailItem.media_type, title, poster_path: d.poster_path, release_date: d.release_date, first_air_date: d.first_air_date, genres: d.genres })}
                        className="p-3 rounded-full" style={{ background: "#2A2130", border: `1px solid ${C.border}` }} aria-label="Marquer comme déjà vu">
                        <Icon name="eyeOff" size={18} color={C.inkMuted} />
                      </button>
                      <button onClick={() => addFavorite({ id: d.id, media_type: detailItem.media_type, title, poster_path: d.poster_path, release_date: d.release_date, first_air_date: d.first_air_date })}
                        className="flex-1 rounded-full py-3 text-sm font-medium flex items-center justify-center gap-2" style={{ background: C.amber, color: "#1A1305" }}>
                        <Icon name="heart" size={16} color="#1A1305" fill="#1A1305" /> Perso
                      </button>
                      <button onClick={() => addSharedFavorite({ id: d.id, media_type: detailItem.media_type, title, poster_path: d.poster_path, release_date: d.release_date, first_air_date: d.first_air_date })}
                        className="flex-1 rounded-full py-3 text-sm font-medium flex items-center justify-center gap-2" style={{ background: C.teal, color: "#0A1614" }}>
                        <Icon name="home" size={16} color="#0A1614" fill="#0A1614" /> Foyer
                      </button>
                    </div>
                  </div>
                </>
              );
            })()}
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed top-4 left-1/2 z-50 rounded-full px-4 py-2 text-xs font-medium" style={{ transform: "translateX(-50%)", background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CeSoir />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
