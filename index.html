<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ce soir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #10121A; }
  @keyframes sweep { 0% { transform: translateX(-120%) skewX(-15deg); } 100% { transform: translateX(220%) skewX(-15deg); } }
  @media (prefers-reduced-motion: reduce) { .sweep { animation: none !important; } .card-transition { transition: none !important; } }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  body { font-family: 'Inter', sans-serif; }
  input:focus, button:focus, textarea:focus, select:focus { outline: 2px solid #E8A33D; outline-offset: 2px; }
  .card-transition { transition: transform 0.35s ease, opacity 0.35s ease; }
  .scrollbar-none::-webkit-scrollbar { display: none; }
  .animate-spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ---------------------------------------------------------------------------
// !!! À REMPLACER après déploiement du Worker Cloudflare (étape "wrangler deploy") !!!
// ---------------------------------------------------------------------------
const WORKER_URL = "https://royal-smoke-0062.maximilien-leleu-ae.workers.dev";

// ---------------------------------------------------------------------------
// Tokens
// ---------------------------------------------------------------------------
const C = {
  bg: "#10121A", bgCard: "#1B1E2B", amber: "#E8A33D", amberDim: "#B87F2C",
  teal: "#4A8B8F", ink: "#F1ECE1", inkMuted: "#8B8A99", danger: "#C1502E", border: "#2E3244",
};

const MOVIE_GENRE_NAMES_FR = [
  "Action", "Aventure", "Animation", "Comédie", "Crime", "Documentaire", "Drame",
  "Familial", "Fantastique", "Histoire", "Horreur", "Musique", "Mystère", "Romance",
  "Science-Fiction", "Téléfilm", "Thriller", "Guerre", "Western",
];

const FALLBACK_POSTER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='600'><rect width='400' height='600' fill='#1B1E2B'/><text x='200' y='300' fill='#8B8A99' font-family='sans-serif' font-size='20' text-anchor='middle'>Pas d'affiche</text></svg>`
);

// ---------------------------------------------------------------------------
// localStorage helpers (remplace window.storage, indisponible hors artefact claude.ai)
// ---------------------------------------------------------------------------
async function storageGet(key) {
  try {
    const v = localStorage.getItem("ce-soir:" + key);
    return v !== null ? { value: v } : null;
  } catch { return null; }
}
async function storageSet(key, value) {
  try { localStorage.setItem("ce-soir:" + key, value); } catch {}
  return { key, value };
}

async function safeJson(res) {
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function yearOf(item) { const d = item.release_date || item.first_air_date; return d ? d.slice(0, 4) : "—"; }
function titleOf(item) { return item.title || item.name || "Sans titre"; }

// ---------------------------------------------------------------------------
// Minimal icon set (remplace lucide-react, indisponible en UMD simple)
// ---------------------------------------------------------------------------
function Icon({ name, size = 18, color = "currentColor", fill = "none" }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill, stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
    sparkles: <path d="M12 3l1.6 4.8L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.2L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>,
    x: <><path d="M18 6 6 18"/><path d="M6 6l12 12"/></>,
    heart: <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>,
    play: <path d="M6 3l15 9-15 9V3z" fill={color}/>,
    upload: <><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></>,
    chevronUp: <path d="M6 15l6-6 6 6"/>,
    chevronDown: <path d="M6 9l6 6 6-6"/>,
    star: <path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-1L12 2z"/>,
    shuffle: <><path d="M2 5h4l10 14h4"/><path d="M16 5h4v4"/><path d="M2 19l6-6"/><path d="M14 9l2-2"/></>,
    loader: <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>,
    film: <><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></>,
    tv: <><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 22h8M12 18v4"/></>,
    trash: <><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14"/></>,
  };
  return <svg {...common} className={name === "loader" ? "animate-spin" : ""}>{paths[name] || null}</svg>;
}

// ---------------------------------------------------------------------------
// Main App
// ---------------------------------------------------------------------------
function CeSoir() {
  const [booted, setBooted] = useState(false);
  const [tmdbKey, setTmdbKey] = useState("");
  const [keyDraft, setKeyDraft] = useState("");
  const [settingsOpen, setSettingsOpen] = useState(false);

  const [genreMap, setGenreMap] = useState({});
  const [genresLoaded, setGenresLoaded] = useState(false);

  const [tasteProfile, setTasteProfile] = useState(null);
  const [csvStatus, setCsvStatus] = useState("");
  const [csvLoading, setCsvLoading] = useState(false);

  const [moodInput, setMoodInput] = useState("");
  const [moodLoading, setMoodLoading] = useState(false);
  const [moodError, setMoodError] = useState("");

  const [mediaType, setMediaType] = useState("movie");
  const [activeGenreIds, setActiveGenreIds] = useState([]);
  const [minRating, setMinRating] = useState(0);
  const [sortBy, setSortBy] = useState("popularity.desc");

  const [results, setResults] = useState([]);
  const [resultsLoading, setResultsLoading] = useState(false);
  const [resultsError, setResultsError] = useState("");
  const [currentIndex, setCurrentIndex] = useState(0);

  const [seenIds, setSeenIds] = useState(new Set());
  const [favorites, setFavorites] = useState([]);
  const [favDrawerOpen, setFavDrawerOpen] = useState(false);

  const [trailerOpenFor, setTrailerOpenFor] = useState(null);
  const [trailerUrl, setTrailerUrl] = useState("");
  const [trailerLoading, setTrailerLoading] = useState(false);

  const [toast, setToast] = useState("");
  const dragState = useRef({ dragging: false, startX: 0, dx: 0 });
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);

  useEffect(() => {
    (async () => {
      const key = await storageGet("tmdb-api-key");
      if (key?.value) setTmdbKey(key.value);
      const tp = await storageGet("taste-profile");
      if (tp?.value) { try { setTasteProfile(JSON.parse(tp.value)); } catch {} }
      const seen = await storageGet("seen-ids");
      if (seen?.value) { try { setSeenIds(new Set(JSON.parse(seen.value))); } catch {} }
      const favs = await storageGet("favorites");
      if (favs?.value) { try { setFavorites(JSON.parse(favs.value)); } catch {} }
      setBooted(true);
    })();
  }, []);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(""), 2200); }

  async function saveKey() {
    const k = keyDraft.trim();
    if (!k) return;
    setTmdbKey(k);
    setKeyDraft("");
    await storageSet("tmdb-api-key", k);
    showToast("Clé TMDB enregistrée");
  }

  const loadGenres = useCallback(async (key) => {
    if (!key) return;
    try {
      const [gm, gt] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${key}&language=fr-FR`).then(safeJson),
        fetch(`https://api.themoviedb.org/3/genre/tv/list?api_key=${key}&language=fr-FR`).then(safeJson),
      ]);
      const map = {};
      gm.genres?.forEach((g) => { map[g.name.toLowerCase()] = { ...(map[g.name.toLowerCase()] || {}), movie: g.id }; });
      gt.genres?.forEach((g) => { map[g.name.toLowerCase()] = { ...(map[g.name.toLowerCase()] || {}), tv: g.id }; });
      setGenreMap(map);
      setGenresLoaded(true);
    } catch { setGenresLoaded(false); }
  }, []);

  useEffect(() => { if (tmdbKey) loadGenres(tmdbKey); }, [tmdbKey, loadGenres]);

  function handleCsvFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!tmdbKey) { showToast("Ajoute d'abord ta clé TMDB"); return; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const text = String(ev.target.result || "");
      const lines = text.split(/\r?\n/).filter(Boolean);
      const header = lines[0]?.toLowerCase().split(",") || [];
      let titleIdx = header.findIndex((h) => h.includes("title"));
      if (titleIdx === -1) titleIdx = 0;
      const rawTitles = lines.slice(1).map((line) => {
        const cells = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
        const t = (cells[titleIdx] || "").replace(/^"|"$/g, "").trim();
        return t.split(":")[0].trim();
      }).filter(Boolean);

      const unique = [...new Set(rawTitles)];
      const sample = unique.slice(0, 40);
      setCsvLoading(true);
      setCsvStatus(`Analyse de ${sample.length} titres sur ${unique.length}…`);

      const genreCount = {};
      let matched = 0;
      for (const t of sample) {
        try {
          const r = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&language=fr-FR&query=${encodeURIComponent(t)}`).then(safeJson);
          const hit = r.results?.find((x) => x.media_type === "movie" || x.media_type === "tv");
          if (hit) { matched++; (hit.genre_ids || []).forEach((g) => (genreCount[g] = (genreCount[g] || 0) + 1)); }
        } catch {}
      }
      const topIds = Object.entries(genreCount).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id]) => Number(id));
      const names = Object.entries(genreMap).filter(([, ids]) => topIds.includes(ids.movie) || topIds.includes(ids.tv)).map(([name]) => name);

      const profile = { genreIds: topIds, names, sampleCount: matched, total: unique.length };
      setTasteProfile(profile);
      await storageSet("taste-profile", JSON.stringify(profile));
      setCsvLoading(false);
      setCsvStatus(`${matched} titres reconnus sur ${sample.length} · goûts dominants : ${names.slice(0, 4).join(", ") || "non déterminés"}`);
    };
    reader.readAsText(file);
  }

  const runDiscover = useCallback(async ({ type = mediaType, genreIds = activeGenreIds, minVote = minRating, sort = sortBy, castIds = [], yearFrom, yearTo, page = 1 } = {}) => {
    if (!tmdbKey) { setSettingsOpen(true); showToast("Ajoute ta clé TMDB pour lancer une recherche"); return; }
    setResultsLoading(true);
    setResultsError("");
    try {
      const params = new URLSearchParams({ api_key: tmdbKey, language: "fr-FR", sort_by: sort, "vote_count.gte": "30", page: String(page) });
      if (genreIds.length) params.set("with_genres", genreIds.join(","));
      if (minVote) params.set("vote_average.gte", String(minVote));
      if (castIds.length) params.set("with_cast", castIds.join(","));
      const dateField = type === "movie" ? "primary_release_date" : "first_air_date";
      if (yearFrom) params.set(`${dateField}.gte`, `${yearFrom}-01-01`);
      if (yearTo) params.set(`${dateField}.lte`, `${yearTo}-12-31`);

      const url = `https://api.themoviedb.org/3/discover/${type === "movie" ? "movie" : "tv"}?${params.toString()}`;
      const data = await fetch(url).then(safeJson);
      const items = (data.results || []).map((it) => ({ ...it, media_type: type })).filter((it) => !seenIds.has(`${type}-${it.id}`));
      setResults(items);
      setCurrentIndex(0);
      if (!items.length) setResultsError("Aucun résultat pour ces critères — élargis un peu les filtres.");
    } catch { setResultsError("Impossible de charger les suggestions (clé TMDB invalide ou hors-ligne ?)."); }
    setResultsLoading(false);
  }, [tmdbKey, mediaType, activeGenreIds, minRating, sortBy, seenIds]);

  async function runMoodSearch() {
    const prompt = moodInput.trim();
    if (!prompt) return;
    if (!tmdbKey) { setSettingsOpen(true); showToast("Ajoute ta clé TMDB pour lancer une recherche"); return; }
    setMoodLoading(true);
    setMoodError("");
    try {
      const system = `Tu transformes une envie exprimée en langage naturel (en français) en critères de recherche TMDB.
Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, sans balises markdown, au format exact :
{"type":"movie"|"tv","genres":[string],"year_from":number|null,"year_to":number|null,"cast_names":[string],"min_rating":number|null,"sort":"popularity.desc"|"vote_average.desc"|"primary_release_date.desc"}
Les genres doivent venir uniquement de cette liste : ${MOVIE_GENRE_NAMES_FR.join(", ")}.
"récent" veut dire année de début = ${new Date().getFullYear() - 3}. "type" vaut "tv" si l'utilisateur mentionne une série, sinon "movie".`;

      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system, messages: [{ role: "user", content: prompt }] }),
      });
      const data = await res.json();
      const text = (data.content || []).map((b) => b.text || "").join("").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);

      const genreIds = (parsed.genres || []).map((n) => genreMap[n.toLowerCase()]?.[parsed.type === "tv" ? "tv" : "movie"]).filter(Boolean);

      let castIds = [];
      if (parsed.cast_names?.length) {
        const found = await Promise.all(parsed.cast_names.slice(0, 3).map((name) =>
          fetch(`https://api.themoviedb.org/3/search/person?api_key=${tmdbKey}&query=${encodeURIComponent(name)}`).then(safeJson).then((r) => r.results?.[0]?.id).catch(() => null)
        ));
        castIds = found.filter(Boolean);
      }

      const type = parsed.type === "tv" ? "tv" : "movie";
      setMediaType(type);
      setActiveGenreIds(genreIds);
      setMinRating(parsed.min_rating || 0);
      setSortBy(parsed.sort || "popularity.desc");

      await runDiscover({ type, genreIds, minVote: parsed.min_rating || 0, sort: parsed.sort || "popularity.desc", castIds, yearFrom: parsed.year_from, yearTo: parsed.year_to });
    } catch (e) { setMoodError("Je n'ai pas réussi à interpréter cette envie — vérifie l'URL du Worker ou reformule."); }
    setMoodLoading(false);
  }

  async function surpriseMe() {
    const genreIds = tasteProfile?.genreIds?.length ? tasteProfile.genreIds : activeGenreIds;
    await runDiscover({ type: mediaType, genreIds, minVote: 6.5, sort: "popularity.desc", page: 1 + Math.floor(Math.random() * 5) });
  }

  async function persistSeen(next) { setSeenIds(next); await storageSet("seen-ids", JSON.stringify([...next])); }
  async function persistFavorites(next) { setFavorites(next); await storageSet("favorites", JSON.stringify(next)); }

  function advanceCard() { setDragX(0); setCurrentIndex((i) => i + 1); setTrailerOpenFor(null); }

  function markSeen(item) {
    const key = `${item.media_type}-${item.id}`;
    const next = new Set(seenIds); next.add(key);
    persistSeen(next); advanceCard();
  }

  function addFavorite(item) {
    const key = `${item.media_type}-${item.id}`;
    if (favorites.some((f) => f.key === key)) { advanceCard(); return; }
    const next = [{ key, id: item.id, media_type: item.media_type, title: titleOf(item), poster: item.poster_path, year: yearOf(item) }, ...favorites].slice(0, 12);
    persistFavorites(next); showToast("Ajouté à ta sélection ♥"); advanceCard();
  }

  function removeFavorite(key) { persistFavorites(favorites.filter((f) => f.key !== key)); }

  async function openTrailer(item) {
    if (trailerOpenFor === item.id) { setTrailerOpenFor(null); return; }
    setTrailerOpenFor(item.id); setTrailerLoading(true); setTrailerUrl("");
    try {
      const kind = item.media_type === "movie" ? "movie" : "tv";
      let data = await fetch(`https://api.themoviedb.org/3/${kind}/${item.id}/videos?api_key=${tmdbKey}&language=fr-FR`).then(safeJson);
      let vid = data.results?.find((v) => v.site === "YouTube" && v.type === "Trailer");
      if (!vid) {
        data = await fetch(`https://api.themoviedb.org/3/${kind}/${item.id}/videos?api_key=${tmdbKey}&language=en-US`).then(safeJson);
        vid = data.results?.find((v) => v.site === "YouTube" && v.type === "Trailer") || data.results?.[0];
      }
      if (vid) setTrailerUrl(`https://www.youtube.com/embed/${vid.key}?autoplay=1`);
    } catch {}
    setTrailerLoading(false);
  }

  function onPointerDown(e) { dragState.current = { dragging: true, startX: e.clientX, dx: 0 }; setDragging(true); }
  function onPointerMove(e) { if (!dragState.current.dragging) return; const dx = e.clientX - dragState.current.startX; dragState.current.dx = dx; setDragX(dx); }
  function onPointerUp() {
    if (!dragState.current.dragging) return;
    const dx = dragState.current.dx; dragState.current.dragging = false; setDragging(false);
    const current = results[currentIndex];
    if (Math.abs(dx) > 110 && current) { if (dx > 0) addFavorite(current); else markSeen(current); } else { setDragX(0); }
  }

  function toggleGenre(name) {
    const id = genreMap[name.toLowerCase()]?.[mediaType];
    if (!id) return;
    const next = activeGenreIds.includes(id) ? activeGenreIds.filter((g) => g !== id) : [...activeGenreIds, id];
    setActiveGenreIds(next);
    runDiscover({ genreIds: next });
  }

  async function resetSeenAndFavorites() { await persistSeen(new Set()); await persistFavorites([]); showToast("Historique de choix réinitialisé"); }

  const current = results[currentIndex];
  const next2 = results.slice(currentIndex + 1, currentIndex + 3);

  if (!booted) {
    return <div style={{ background: C.bg, minHeight: "100vh" }} className="flex items-center justify-center"><Icon name="loader" color={C.amber} size={28} /></div>;
  }

  return (
    <div style={{ background: C.bg, color: C.ink, minHeight: "100vh" }} className="w-full flex flex-col relative overflow-hidden">
      <header className="relative px-5 pt-6 pb-4 flex items-center justify-between overflow-hidden" style={{ borderBottom: `1px solid ${C.border}` }}>
        <div className="sweep absolute inset-y-0 left-0 w-1/3 pointer-events-none" style={{ background: `linear-gradient(90deg, transparent, ${C.amber}22, transparent)`, animation: "sweep 2.4s ease-out 1" }} />
        <div>
          <p className="font-mono text-xs tracking-widest" style={{ color: C.amberDim }}>SÉANCE DU SOIR</p>
          <h1 className="font-display text-3xl">Ce soir</h1>
        </div>
        <button onClick={() => setSettingsOpen(true)} aria-label="Réglages" className="p-2 rounded-full" style={{ background: C.bgCard }}>
          <Icon name="settings" color={C.inkMuted} />
        </button>
      </header>

      <div className="px-5 pt-4">
        <div className="flex gap-2">
          <input value={moodInput} onChange={(e) => setMoodInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && runMoodSearch()}
            placeholder="Une comédie française récente avec…" className="flex-1 rounded-xl px-4 py-3 text-sm"
            style={{ background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }} />
          <button onClick={runMoodSearch} disabled={moodLoading} className="rounded-xl px-4 flex items-center justify-center" style={{ background: C.amber, color: "#1A1305" }} aria-label="Chercher">
            <Icon name={moodLoading ? "loader" : "sparkles"} size={18} fill={moodLoading ? "none" : "#1A1305"} />
          </button>
        </div>
        {moodError && <p className="text-xs mt-2" style={{ color: C.danger }}>{moodError}</p>}
      </div>

      <div className="px-5 pt-3 flex gap-2 overflow-x-auto scrollbar-none">
        <button onClick={() => { const t = mediaType === "movie" ? "tv" : "movie"; setMediaType(t); runDiscover({ type: t }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5" style={{ background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }}>
          <Icon name={mediaType === "movie" ? "film" : "tv"} size={13} />
          {mediaType === "movie" ? "Films" : "Séries"}
        </button>
        {["Comédie", "Drame", "Thriller", "Action", "Science-Fiction", "Horreur", "Romance", "Animation"].map((g) => (
          <button key={g} onClick={() => toggleGenre(g)} className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium"
            style={{ background: activeGenreIds.includes(genreMap[g.toLowerCase()]?.[mediaType]) ? C.amber : C.bgCard, color: activeGenreIds.includes(genreMap[g.toLowerCase()]?.[mediaType]) ? "#1A1305" : C.ink, border: `1px solid ${C.border}` }}>
            {g}
          </button>
        ))}
        <button onClick={() => { const v = minRating >= 7 ? 0 : 7; setMinRating(v); runDiscover({ minVote: v }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1" style={{ background: minRating >= 7 ? C.amber : C.bgCard, color: minRating >= 7 ? "#1A1305" : C.ink, border: `1px solid ${C.border}` }}>
          <Icon name="star" size={12} fill={minRating >= 7 ? "#1A1305" : "none"} /> 7+
        </button>
        <select value={sortBy} onChange={(e) => { setSortBy(e.target.value); runDiscover({ sort: e.target.value }); }}
          className="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium" style={{ background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }}>
          <option value="popularity.desc">Tri : Popularité</option>
          <option value="vote_average.desc">Tri : Note</option>
          <option value="primary_release_date.desc">Tri : Année</option>
        </select>
      </div>

      <main className="flex-1 px-5 py-6 flex flex-col items-center justify-center relative" style={{ minHeight: 460 }}>
        {resultsLoading && <Icon name="loader" color={C.amber} size={26} />}
        {!resultsLoading && resultsError && <p className="text-sm text-center px-6" style={{ color: C.inkMuted }}>{resultsError}</p>}
        {!resultsLoading && !results.length && !resultsError && (
          <div className="text-center px-6">
            <p className="font-display text-xl mb-2">Prêt pour la séance ?</p>
            <p className="text-sm" style={{ color: C.inkMuted }}>Tape ton envie du moment ci-dessus, choisis un genre, ou laisse-toi surprendre.</p>
          </div>
        )}

        {!resultsLoading && current && (
          <div className="relative w-full max-w-sm" style={{ height: 460 }}>
            {next2.map((it, i) => (
              <div key={it.id + it.media_type} className="absolute inset-0 rounded-2xl"
                style={{ background: C.bgCard, transform: `scale(${0.96 - i * 0.04}) translateY(${(i + 1) * 10}px)`, zIndex: 1 - i, border: `1px solid ${C.border}` }} />
            ))}
            <div className="absolute inset-0 rounded-2xl overflow-hidden card-transition select-none"
              style={{ zIndex: 5, transform: `translateX(${dragX}px) rotate(${dragX / 20}deg)`, border: `1px solid ${C.border}`, cursor: dragging ? "grabbing" : "grab", touchAction: "pan-y" }}
              onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}>
              <img src={current.poster_path ? `https://image.tmdb.org/t/p/w500${current.poster_path}` : FALLBACK_POSTER} alt="" className="w-full h-full object-cover" draggable={false} />
              <div className="absolute inset-0" style={{ background: "linear-gradient(to top, #10121Af2 5%, #10121A66 45%, transparent 70%)" }} />
              <div className="absolute top-3 right-3 rounded-full px-2.5 py-1 flex items-center gap-1 font-mono text-xs" style={{ background: "#10121Ad0", border: `1px solid ${C.amberDim}` }}>
                <Icon name="star" size={11} color={C.amber} fill={C.amber} />
                <span style={{ color: C.amber }}>{current.vote_average?.toFixed(1) ?? "—"}</span>
              </div>
              {dragX < -40 && <div className="absolute top-6 left-4 rounded-lg px-3 py-1 font-mono text-xs" style={{ background: C.danger, color: "#fff" }}>DÉJÀ VU</div>}
              {dragX > 40 && <div className="absolute top-6 right-4 rounded-lg px-3 py-1 font-mono text-xs" style={{ background: C.amber, color: "#1A1305" }}>SÉLECTION</div>}
              <div className="absolute bottom-0 left-0 right-0 p-4">
                <p className="font-mono text-[11px] tracking-wide mb-1" style={{ color: C.teal }}>{yearOf(current)} · {current.media_type === "movie" ? "FILM" : "SÉRIE"}</p>
                <h2 className="font-display text-2xl leading-tight mb-2">{titleOf(current)}</h2>
                <p className="text-sm leading-snug mb-3" style={{ color: C.inkMuted, display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }}>
                  {current.overview || "Synopsis non disponible."}
                </p>
                {trailerOpenFor === current.id && (
                  <div className="mb-3 rounded-lg overflow-hidden" style={{ aspectRatio: "16/9", background: "#000" }}>
                    {trailerLoading && <div className="w-full h-full flex items-center justify-center"><Icon name="loader" color={C.amber} size={20} /></div>}
                    {!trailerLoading && trailerUrl && <iframe src={trailerUrl} className="w-full h-full" allow="autoplay; encrypted-media" title="Bande-annonce" />}
                    {!trailerLoading && !trailerUrl && <p className="text-xs p-3" style={{ color: C.inkMuted }}>Pas de bande-annonce trouvée.</p>}
                  </div>
                )}
                <div className="flex items-center gap-2">
                  <button onClick={() => markSeen(current)} className="p-3 rounded-full" style={{ background: "#2A2130", border: `1px solid ${C.border}` }} aria-label="Déjà vu, passer">
                    <Icon name="x" size={18} color={C.danger} />
                  </button>
                  <button onClick={() => openTrailer(current)} className="flex-1 rounded-full py-3 text-sm font-medium flex items-center justify-center gap-2" style={{ background: C.bgCard, border: `1px solid ${C.border}` }}>
                    <Icon name="play" size={15} color={C.ink} fill={C.ink} /> Bande-annonce
                  </button>
                  <button onClick={() => addFavorite(current)} className="p-3 rounded-full" style={{ background: "#2A2A18", border: `1px solid ${C.border}` }} aria-label="Ajouter à ma sélection">
                    <Icon name="heart" size={18} color={C.amber} />
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {!resultsLoading && results.length > 0 && !current && (
          <div className="text-center px-6">
            <p className="font-display text-xl mb-2">Plus rien pour ce soir</p>
            <p className="text-sm" style={{ color: C.inkMuted }}>Lance une nouvelle recherche ou surprends-toi.</p>
          </div>
        )}
      </main>

      <button onClick={surpriseMe} className="fixed left-1/2 rounded-full px-5 py-3 text-sm font-semibold flex items-center gap-2 shadow-lg"
        style={{ bottom: 84, transform: "translateX(-50%)", background: C.amber, color: "#1A1305" }}>
        <Icon name="shuffle" size={16} /> Surprends-moi
      </button>

      <div className="fixed left-0 right-0 bottom-0 rounded-t-2xl card-transition"
        style={{ background: C.bgCard, borderTop: `1px solid ${C.border}`, transform: favDrawerOpen ? "translateY(0)" : "translateY(calc(100% - 52px))", maxHeight: "70vh" }}>
        <button onClick={() => setFavDrawerOpen((o) => !o)} className="w-full flex items-center justify-between px-5 py-3.5">
          <span className="text-sm font-medium">Ma sélection ce soir ({favorites.length})</span>
          <Icon name={favDrawerOpen ? "chevronDown" : "chevronUp"} size={18} color={C.inkMuted} />
        </button>
        <div className="px-5 pb-6 overflow-y-auto" style={{ maxHeight: "55vh" }}>
          {favorites.length === 0 && <p className="text-xs pb-3" style={{ color: C.inkMuted }}>Glisse une carte vers la droite (ou ♥) pour la garder ici.</p>}
          {favorites.map((f) => (
            <div key={f.key} className="flex items-center gap-3 py-2" style={{ borderBottom: `1px solid ${C.border}` }}>
              <img src={f.poster ? `https://image.tmdb.org/t/p/w92${f.poster}` : FALLBACK_POSTER} alt="" className="w-10 h-14 object-cover rounded" />
              <div className="flex-1 min-w-0">
                <p className="text-sm truncate">{f.title}</p>
                <p className="font-mono text-[11px]" style={{ color: C.inkMuted }}>{f.year} · {f.media_type === "movie" ? "Film" : "Série"}</p>
              </div>
              <button onClick={() => removeFavorite(f.key)} aria-label="Retirer" className="p-2"><Icon name="trash" size={15} color={C.inkMuted} /></button>
            </div>
          ))}
        </div>
      </div>

      {settingsOpen && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "#000000a0" }} onClick={() => setSettingsOpen(false)}>
          <div className="w-full rounded-t-2xl p-5" style={{ background: C.bgCard, borderTop: `1px solid ${C.border}` }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-display text-xl">Réglages</h3>
              <button onClick={() => setSettingsOpen(false)} aria-label="Fermer"><Icon name="x" size={20} color={C.inkMuted} /></button>
            </div>
            <label className="text-xs font-mono block mb-1.5" style={{ color: C.inkMuted }}>CLÉ API TMDB (gratuite sur themoviedb.org)</label>
            <div className="flex gap-2 mb-1">
              <input value={keyDraft || tmdbKey} onChange={(e) => setKeyDraft(e.target.value)} placeholder="Colle ta clé v3 ici"
                className="flex-1 rounded-lg px-3 py-2.5 text-sm" style={{ background: C.bg, border: `1px solid ${C.border}`, color: C.ink }} />
              <button onClick={saveKey} className="rounded-lg px-4 text-sm font-medium" style={{ background: C.amber, color: "#1A1305" }}>Enregistrer</button>
            </div>
            {tmdbKey && genresLoaded && <p className="text-xs mb-4" style={{ color: C.teal }}>Clé active ✓</p>}
            {tmdbKey && !genresLoaded && <p className="text-xs mb-4" style={{ color: C.danger }}>Clé invalide ou hors-ligne</p>}
            {!tmdbKey && <p className="text-xs mb-4" style={{ color: C.inkMuted }}>Sans clé, aucune recherche n'est possible.</p>}

            <label className="text-xs font-mono block mb-1.5" style={{ color: C.inkMuted }}>HISTORIQUE NETFLIX (export CSV)</label>
            <label className="flex items-center justify-center gap-2 rounded-lg px-3 py-3 text-sm mb-1 cursor-pointer" style={{ background: C.bg, border: `1px dashed ${C.border}`, color: C.ink }}>
              <Icon name="upload" size={16} /> Importer le fichier CSV
              <input type="file" accept=".csv" className="hidden" onChange={handleCsvFile} />
            </label>
            {csvLoading && <p className="text-xs mb-4 flex items-center gap-1.5" style={{ color: C.inkMuted }}><Icon name="loader" size={12} color={C.inkMuted} /> {csvStatus}</p>}
            {!csvLoading && csvStatus && <p className="text-xs mb-4" style={{ color: C.teal }}>{csvStatus}</p>}
            {!csvStatus && !csvLoading && tasteProfile && <p className="text-xs mb-4" style={{ color: C.teal }}>Profil déjà chargé · goûts : {tasteProfile.names.slice(0, 4).join(", ") || "—"}</p>}

            <button onClick={resetSeenAndFavorites} className="w-full text-center text-xs py-2.5 rounded-lg" style={{ color: C.danger, border: `1px solid ${C.border}` }}>
              Réinitialiser « déjà vu » et sélection
            </button>
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed top-4 left-1/2 z-50 rounded-full px-4 py-2 text-xs font-medium" style={{ transform: "translateX(-50%)", background: C.bgCard, border: `1px solid ${C.border}`, color: C.ink }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CeSoir />);
</script>
</body>
</html>
